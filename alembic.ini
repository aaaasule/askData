[alembic]
script_location = alembic
# Leave empty. Prepending the repo root would shadow the installed Alembic
# package with this `alembic/` directory. env.py adds the repo root after import.
prepend_sys_path =
version_path_separator = os
path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./askdata.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
