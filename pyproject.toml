[project]
name = "askdata"
version = "0.1.0"
description = "Independent 调研问数 research service (FastAPI); LangChat analysis SSE-compatible"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "sqlglot>=25.0.0",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "python-dotenv>=1.0.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
db = [
  "asyncpg>=0.30.0",
  "aiomysql>=0.2.0",
]
db-oracle = [
  "oracledb>=2.2.0",
]
db-mssql = [
  "aioodbc>=0.5.0",
  "pyodbc>=5.1.0",
]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
